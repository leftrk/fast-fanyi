<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- fast-fanyi 图标：纯白底 + A→Z 叠放对话气泡 -->
  <defs>
    <clipPath id="squircle">
      <rect x="20" y="20" width="984" height="984" rx="230"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- 纯白底 -->
    <rect x="20" y="20" width="984" height="984" rx="230" fill="#FFFFFF"/>

    <g transform="translate(-8 -30)">
      <!-- 气泡 A：亮蓝，左下，微左倾 -->
      <g transform="rotate(-6 385 565)">
        <polygon points="340,684 295,782 415,690" fill="#2E5BF5" stroke="#1C1C3D" stroke-width="14" stroke-linejoin="round"/>
        <rect x="230" y="440" width="310" height="250" rx="44" fill="#2E5BF5" stroke="#1C1C3D" stroke-width="14"/>
        <text x="385" y="575" font-family="Helvetica Neue, Arial, sans-serif" font-weight="900"
              font-size="155" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">A</text>
      </g>

      <!-- 气泡 Z：珊瑚橙，右上，微右倾，压在 A 上 -->
      <g transform="rotate(6 655 465)">
        <polygon points="610,584 725,672 660,590" fill="#FF6B5B" stroke="#1C1C3D" stroke-width="14" stroke-linejoin="round"/>
        <rect x="500" y="340" width="310" height="250" rx="44" fill="#FF6B5B" stroke="#1C1C3D" stroke-width="14"/>
        <text x="655" y="475" font-family="Helvetica Neue, Arial, sans-serif" font-weight="900"
              font-size="155" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Z</text>
      </g>
    </g>
  </g>
</svg>
